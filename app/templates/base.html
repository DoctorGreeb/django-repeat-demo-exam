{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="{% static 'css/style.css' %}">
     <style>
        body {
            background-image: url('{% static 'media/tomas-blog.png' %}');
            backdrop-filter: blur(10px);
            background-size: cover;
        }
        @font-face {
            font-family: 'PT Sans';
            src: url("{% static 'fonts/PTSans-Regular.ttf' %}");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'PT Sans';
            src: url("{% static 'fonts/PTSans-Italic.ttf' %}");
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'PT Sans';
            src: url("{% static 'fonts/PTSans-Bold.ttf' %}");
            font-weight:bold;
            font-style:normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'PT Sans';
            src: url("{% static 'fonts/PTSans-BoldItalic.ttf' %}");
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }
    </style>
</head>
<body>
    <header>
        <div class="left-header">
            <div class="logo">Мероприятия</div>
            <a href="/">Главная</a>
        </div>
        <div class="right-header">
            <a href="/create">Создать заявку</a>
            {% if user.is_authenticated %}
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button>Выход</button>
            
                </form>
                {% else %}
                <a href="/accounts/login">Войти</a>
                <a href="/register">Регистрация</a>
                {% endif %}
        </div>

    </header>
    <main>
        {% block content %}

        {% endblock %}
    </main>

    <footer>
        <div>Подвал сайта 26</div>
    </footer>
    
</body>
</html>
